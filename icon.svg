<?xml version="1.0" encoding="UTF-8"?>
<!-- NetworthXray mark. Kept as data-free geometry so the header, the favicon,
     the apple-touch icon and the PWA manifest share one file. The b2c accent
     lives in packages/core/brand.config.json; this mark's gold/blue chart is
     the fixed brand mark, not the accent token. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D78A"/><stop offset="1" stop-color="#C9962F"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9962F"/><stop offset="1" stop-color="#4F8DFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0B1220"/>
  <circle cx="256" cy="228" r="118" fill="#0F1A2E" stroke="url(#g)" stroke-width="11"/>
  <path d="M160 228 C210 164 302 164 352 228 C302 292 210 292 160 228 Z"
        fill="none" stroke="url(#g)" stroke-width="7"/>
  <path d="M196 258 L238 204 L278 236 L328 172" fill="none" stroke="url(#c)"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="238" cy="204" r="7" fill="#C9962F"/>
  <circle cx="278" cy="236" r="7" fill="#4F8DFF"/>
  <circle cx="328" cy="172" r="9" fill="#4F8DFF"/>
  <line x1="352" y1="326" x2="432" y2="406" stroke="url(#g)" stroke-width="17"
        stroke-linecap="round"/>
</svg>
